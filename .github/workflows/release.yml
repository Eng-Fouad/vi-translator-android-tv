# Pushing a tag vX.Y.Z releases version X.Y.Z of the app, attached to a GitHub Release:
#   vi-translator-android-tv-X.Y.Z.apk  signed APK, to install directly (Downloader, adb)
#   vi-translator-android-tv-X.Y.Z.aab  signed app bundle, to upload to Google Play (the key is Play's upload key)
#
# Same tag rules as the desktop app: the tag must look like v1.2.3 and be newer than the latest release.
#
# Repository secrets (the same key must sign every release, or the TV refuses the update):
#   ANDROID_KEYSTORE_B64       the release keystore (PKCS12 .p12), base64
#   ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   ANDROID_KEY_ALIAS          the key's alias in it
#   ANDROID_KEY_PASSWORD       the key's password
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check the tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Tags must look like v1.2.3, minor and patch under 100 (got $GITHUB_REF_NAME)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Must be newer than the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          CUR=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          CUR="${CUR#v}"
          echo "latest release: ${CUR:-none}, tag: $V"
          if [ -n "$CUR" ] && { [ "$CUR" = "$V" ] || [ "$(printf '%s\n%s\n' "$CUR" "$V" | sort -V | tail -n1)" != "$V" ]; }; then
            echo "::error::$V is not newer than the latest release $CUR"; exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease lintRelease -Pversion="$VERSION"

      - name: Check the signatures and name the files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -f "$APK" ] || { echo "::error::no signed APK (is the keystore right?)"; ls -R app/build/outputs; exit 1; }
          [ -f "$AAB" ] || { echo "::error::no app bundle"; ls -R app/build/outputs; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/apksigner verify --print-certs "$APK"
          jarsigner -verify "$AAB" | grep -q "^jar verified" || { echo "::error::the app bundle isn't signed"; exit 1; }
          echo "app bundle signed"
          mkdir -p out
          cp "$APK" "out/vi-translator-android-tv-$VERSION.apk"
          cp "$AAB" "out/vi-translator-android-tv-$VERSION.aab"
          rm -f "$ANDROID_KEYSTORE"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: vi-translator-android-tv
          path: out/*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "VI Translator for Android TV $V" --generate-notes --verify-tag
